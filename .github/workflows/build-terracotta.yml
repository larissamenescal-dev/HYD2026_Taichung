name: Build Terracotta preview
on:
  push:
    branches:
      - design/terracotta-map-theme-2026
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate published HTML from source templates
        run: python3 scripts/build_map.py
      - name: Verify Terracotta appears in generated pages
        run: |
          grep -q 'data-style-set="terracotta"' map/index.html
          grep -q 'data-style-set="terracotta"' index.html
      - name: Commit generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html map/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Build Terracotta HTML pages"
            git push
          fi
